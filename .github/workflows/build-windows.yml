name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/release-3.6.0.request']
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Verify pinned action commits against GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pins = @{
            'checkout' = '11d5960a326750d5838078e36cf38b85af677262'
            'setup-dotnet' = '67a3573c9a986a3f9c594539f4ab511d57bb3ce9'
            'upload-artifact' = 'ea165f8d65b6e75b540449e92b4886f43607fa02'
          }
          foreach ($name in $pins.Keys) {
            $actual = gh api "repos/actions/$name/commits/$($pins[$name])" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $actual -ne $pins[$name]) { throw "Cannot verify actions/$name pinned commit." }
            Write-Host "Verified actions/$name@$actual from GitHub API"
          }

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Run regression checks
        shell: pwsh
        run: |
          python Scripts/test_link_health.py
          if ($LASTEXITCODE -ne 0) { throw 'Link health checks failed.' }
          dotnet run --project Tests/CatalogTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'C# regression checks failed.' }
          pwsh -NoProfile -File Tests/FidoRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Fido regression checks failed.' }
          pwsh -NoProfile -File Tests/SdkHealthRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SDK health checks failed.' }
          pwsh -NoProfile -File Tests/OfficeLauncherRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Office launcher checks failed.' }

      - name: Publish self-contained Windows ${{ matrix.arch }} app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            [xml]$project = Get-Content 'WindowsISODownloader/WindowsISODownloader.csproj' -Raw
            if ([string]$project.Project.PropertyGroup.Version -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw 'Tag and application Version must match.' }
          }
          $publish = Join-Path $env:RUNNER_TEMP 'wid-publish-${{ matrix.arch }}'
          dotnet publish 'WindowsISODownloader/WindowsISODownloader.csproj' -c Release -r win-${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $exe = Join-Path $publish 'Windows ISO Downloader.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'EXE was not produced.' }
          if ((Get-Item -LiteralPath $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small.' }
          foreach ($name in @('Fido.ps1','FIDO-LICENSE.txt')) { Copy-Item -LiteralPath (Join-Path 'WindowsISODownloader' $name) -Destination $publish -Force }

      - name: Validate Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\Tests\FidoRegression.ps1
          & .\Tests\SdkHealthRegression.ps1
          & .\Tests\OfficeLauncherRegression.ps1

      - name: Windows runtime smoke checks (x64 only)
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          & .\Tests\CliWindows.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'wid-publish-x64\Windows ISO Downloader.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI runtime checks failed.' }
          & .\Tests\WindowsSmoke.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'wid-publish-x64\Windows ISO Downloader.exe')

      - name: Package EXE with required Fido files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'Windows-ISO-Downloader-win-${{ matrix.arch }}'
          $publish = Join-Path $env:RUNNER_TEMP 'wid-publish-${{ matrix.arch }}'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $publish 'Windows ISO Downloader.exe') -Destination $package -Force
          foreach ($name in @('Fido.ps1', 'FIDO-LICENSE.txt')) {
            Copy-Item -LiteralPath (Join-Path 'WindowsISODownloader' $name) -Destination $package -Force
          }
          foreach ($name in @('wid.cmd','CLI-KILAVUZ.md','SURUM-3.6.0.md','DOGRULAMA-RAPORU.md')) { Copy-Item -LiteralPath $name -Destination $package -Force }
          $zip = Join-Path $env:RUNNER_TEMP 'Windows-ISO-Downloader-win-${{ matrix.arch }}.zip'
          Compress-Archive -LiteralPath $package -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Release ZIP was not produced.' }

      - name: Upload downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-ISO-Downloader-win-${{ matrix.arch }}
          path: ${{ runner.temp }}/Windows-ISO-Downloader-win-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish tested build for version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($arch in @('x64','arm64')) {
            gh run download $env:GITHUB_RUN_ID -R $env:GITHUB_REPOSITORY -n "Windows-ISO-Downloader-win-$arch" -D $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "Could not download tested $arch build." }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build.' }
          $x64 = Join-Path $env:RUNNER_TEMP 'Windows-ISO-Downloader-win-x64.zip'
          $arm64 = Join-Path $env:RUNNER_TEMP 'Windows-ISO-Downloader-win-arm64.zip'
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $lines = @($x64,$arm64) | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($_) }
          [IO.File]::WriteAllLines($sums,$lines,[Text.UTF8Encoding]::new($false))
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v3.6.0' }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $text = 'Windows ISO Downloader 3.6.0: x64 ve ARM64 paketleri. Office kanal/dil/uygulama seçenekleri, genişletilmiş Microsoft ürün kataloğu, komut satırı desteği ve güncelleme bildirimi. ZIP paketinin tamamını çıkarın; Fido.ps1 ve FIDO-LICENSE.txt uygulamanın yanında kalmalıdır. EXE dosyaları Authenticode ile imzalanmamıştır. SHA256SUMS.txt dosya bütünlüğünü karşılaştırmak içindir; yayıncı imzasının yerine geçmez. Windows ARM64 üzerinde yerel açılış testi yapılmamıştır. Microsoft ürünlerinin indirilmesi lisans veya etkinleştirme hakkı sağlamaz.'
          [IO.File]::WriteAllText($notes,$text,[Text.UTF8Encoding]::new($false))
          gh release create $tag $x64 $arm64 $sums -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Windows ISO Downloader $tag" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
